name: Keepsafe Production Migrations

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  migrate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: keepsafe-production-vps
      cancel-in-progress: false
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.39.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install migration history checker
        run: python3 -m pip install 'psycopg[binary]==3.2.9'

      - name: Verify production migration baseline
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          python3 .github/scripts/check-production-migrations.py

      - name: Apply pending SQL migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        working-directory: frontend
        run: |
          set -euo pipefail
          supabase db push --db-url "$SUPABASE_DB_URL" --yes

      - name: Verify final migration history
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          python3 .github/scripts/check-production-migrations.py --require-current
