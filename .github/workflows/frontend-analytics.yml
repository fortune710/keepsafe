name: Frontend analytics

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'docs/analytics.md'
      - '.github/workflows/frontend-analytics.yml'

jobs:
  analytics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check TypeScript
        run: bunx tsc --noEmit
      - name: Test analytics
        run: bunx jest lib/analytics --runInBand --watch=false --watchman=false
