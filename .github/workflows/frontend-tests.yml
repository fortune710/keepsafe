name: Frontend Tests

on:
  pull_request:
    branches: [ main, staging ]
    paths:
      - 'frontend/**'
  push:
    branches: [ staging ]
    paths:
      - 'frontend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      working-directory: ./frontend
      run: bun install --frozen-lockfile

    - name: Run tests
      working-directory: ./frontend
      run: bunx jest --ci --runInBand
