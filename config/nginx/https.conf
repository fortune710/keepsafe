server {
    listen 8080;
    server_name keepsafeapi.fortunealebiosu.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 308 https://keepsafeapi.fortunealebiosu.dev$request_uri;
    }
}

server {
    listen 8443 ssl;
    server_name keepsafeapi.fortunealebiosu.dev;

    ssl_certificate /etc/letsencrypt/live/keepsafeapi.fortunealebiosu.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keepsafeapi.fortunealebiosu.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /api { include /etc/nginx/keepsafe/backend-proxy.conf; }
    location ^~ /api/ { include /etc/nginx/keepsafe/backend-proxy.conf; }
    location ^~ /auth/ { include /etc/nginx/keepsafe/backend-proxy.conf; }
    location ^~ /user/ { include /etc/nginx/keepsafe/backend-proxy.conf; }
    location = /user { include /etc/nginx/keepsafe/backend-proxy.conf; }
    location ^~ /search/ { include /etc/nginx/keepsafe/backend-proxy.conf; }
    location = /search { include /etc/nginx/keepsafe/backend-proxy.conf; }
    location ^~ /monthly-dumps/ { include /etc/nginx/keepsafe/backend-proxy.conf; }
    location = /monthly-dumps { include /etc/nginx/keepsafe/backend-proxy.conf; }
    location ^~ /webhooks/ { include /etc/nginx/keepsafe/backend-proxy.conf; }
    location = /health { include /etc/nginx/keepsafe/backend-proxy.conf; }
    location = /docs { include /etc/nginx/keepsafe/backend-proxy.conf; }
    location ^~ /docs/ { include /etc/nginx/keepsafe/backend-proxy.conf; }
    location = /openapi.json { include /etc/nginx/keepsafe/backend-proxy.conf; }

    location / { return 404; }
}
